<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Felex Music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<header>
    <div class="container header-inner">
        <a href="index.html" class="logo">
            <svg class="logo-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                <path d="M32 6 C20 6 12 14 12 26 C12 32 14 37 18 42 C16 46 15 50 16 56 C17 58 19 58 20 56 C22 52 24 50 26 48 C28 49 30 49 32 49 C34 49 36 49 38 48 C40 50 42 52 44 56 C45 58 47 58 48 56 C49 50 48 46 46 42 C50 37 52 32 52 26 C52 14 44 6 32 6 Z" fill="url(#g1)"/>
                <circle cx="24" cy="28" r="2.5" fill="#0a1929"/>
                <circle cx="40" cy="28" r="2.5" fill="#0a1929"/>
                <defs>
                    <linearGradient id="g1" x1="0" y1="0" x2="64" y2="64">
                        <stop offset="0%" stop-color="#7fdbff"/>
                        <stop offset="100%" stop-color="#2196f3"/>
                    </linearGradient>
                </defs>
            </svg>
            Felex<span>Music</span>
        </a>
        <nav>
            <a href="catalog.html">Каталог</a>
            <a href="admin.html" class="active">Админ-панель</a>
        </nav>
        <div class="header-actions">
            <div id="authArea"></div>
            <button class="cart-btn" id="cartBtn" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                Корзина
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </div>
</header>

<main class="admin-page">
    <div class="container">
        <div class="admin-header">
            <div>
                <h1>👑 Админ-панель</h1>
                <p>Управление товарами и пользователями</p>
            </div>
            <div class="admin-header__actions">
                <button class="btn btn-ghost" id="resetProductsBtn" type="button">🔄 Сбросить товары</button>
            </div>
        </div>

        <!-- Статистика -->
        <div class="admin-stats">
            <div class="admin-stat">
                <div class="admin-stat__icon">📦</div>
                <div class="admin-stat__value" id="statProducts">0</div>
                <div class="admin-stat__label">Товаров</div>
            </div>
            <div class="admin-stat">
                <div class="admin-stat__icon">👥</div>
                <div class="admin-stat__value" id="statUsers">0</div>
                <div class="admin-stat__label">Пользователей</div>
            </div>
            <div class="admin-stat">
                <div class="admin-stat__icon">⭐</div>
                <div class="admin-stat__value" id="statBestsellers">0</div>
                <div class="admin-stat__label">Хитов продаж</div>
            </div>
            <div class="admin-stat">
                <div class="admin-stat__icon">👑</div>
                <div class="admin-stat__value" id="statAdmins">0</div>
                <div class="admin-stat__label">Админов</div>
            </div>
        </div>

        <!-- Табы -->
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="products" type="button">📦 Товары</button>
            <button class="admin-tab" data-tab="users" type="button">👥 Пользователи</button>
        </div>

        <!-- ==== ТОВАРЫ ==== -->
        <div class="admin-panel active" id="productsPanel">
            <div class="admin-toolbar">
                <input type="text" class="filter-input" id="adminSearch" placeholder="Поиск по названию...">
                <button class="btn btn-primary" id="addProductBtn" type="button">➕ Добавить товар</button>
            </div>

            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Фото</th>
                            <th>Название</th>
                            <th>Категория</th>
                            <th>Цена</th>
                            <th>Хит</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- ==== ПОЛЬЗОВАТЕЛИ ==== -->
        <div class="admin-panel" id="usersPanel">
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Email</th>
                            <th>Роль</th>
                            <th>Регистрация</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- ===== МОДАЛКА ТОВАРА ===== -->
<div class="admin-modal" id="productModal" hidden>
    <div class="admin-modal__overlay" data-close></div>
    <div class="admin-modal__panel">
        <header class="admin-modal__header">
            <h2 id="productModalTitle">Добавить товар</h2>
            <button class="cart-modal__close" data-close type="button" aria-label="Закрыть">×</button>
        </header>
        <form class="admin-modal__body" id="productForm">
            <div class="admin-form-grid">
                <div class="auth-field">
                    <label>Название *</label>
                    <input type="text" name="title" required>
                </div>
                <div class="auth-field">
                    <label>Бренд *</label>
                    <input type="text" name="brand" required>
                </div>
                <div class="auth-field">
                    <label>Категория *</label>
                    <select name="category" required>
                        <option value="">Выберите...</option>
                        <option>Гитары</option>
                        <option>Клавишные</option>
                        <option>Ударные</option>
                        <option>Микрофоны</option>
                        <option>Студийное</option>
                        <option>Наушники</option>
                    </select>
                </div>
                <div class="auth-field">
                    <label>Эмодзи</label>
                    <input type="text" name="emoji" maxlength="2" placeholder="🎸">
                </div>
                <div class="auth-field">
                    <label>Цена, ₽ *</label>
                    <input type="number" name="price" min="0" required>
                </div>
                <div class="auth-field">
                    <label>Старая цена, ₽</label>
                    <input type="number" name="oldPrice" min="0">
                </div>
                <div class="auth-field admin-form-grid__full">
                    <label>URL изображения</label>
                    <input type="text" name="image" placeholder="images/products/name.jpg">
                </div>
                <div class="auth-field admin-form-grid__full">
                    <label>Краткое описание *</label>
                    <input type="text" name="desc" required maxlength="120">
                </div>
                <div class="auth-field admin-form-grid__full">
                    <label>Полное описание</label>
                    <textarea name="longDesc" rows="3"></textarea>
                </div>
                <div class="auth-field">
                    <label>Бейдж</label>
                    <select name="badge">
                        <option value="">Без бейджа</option>
                        <option value="hit">Хит</option>
                        <option value="new">Новинка</option>
                    </select>
                </div>
                <div class="auth-field">
                    <label>Хит продаж?</label>
                    <label class="filter-radio" style="padding:0;">
                        <input type="checkbox" name="bestseller">
                        <span>Показывать на главной</span>
                    </label>
                </div>
            </div>
            <div class="admin-modal__footer">
                <button type="button" class="btn btn-ghost" data-close>Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- ===== МОДАЛКА КОРЗИНЫ (нужна для cart.js) ===== -->
<div class="cart-modal" id="cartModal" hidden>
    <div class="cart-modal__overlay" data-close></div>
    <aside class="cart-modal__panel" role="dialog" aria-label="Корзина">
        <header class="cart-modal__header">
            <h2>🛒 Корзина</h2>
            <button class="cart-modal__close" data-close aria-label="Закрыть" type="button">×</button>
        </header>
        <div class="cart-modal__body" id="cartItems"></div>
        <footer class="cart-modal__footer">
            <div class="cart-modal__total"><span>Итого:</span><strong id="cartTotal">0 ₽</strong></div>
            <button class="btn btn-primary" id="checkoutBtn" type="button">Оформить заказ</button>
            <div class="cart-modal__actions">
                <button class="btn btn-ghost" id="clearCartBtn" type="button">Очистить</button>
                <button class="btn btn-ghost" data-close type="button">Продолжить</button>
            </div>
        </footer>
    </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="products.js"></script>
<script src="cart.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
